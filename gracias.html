<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="img/favicon.png" sizes="32x32">
  <title>Gracias - Catalejo</title>

  <link rel="icon" type="image/png" href="img/favicon.png" sizes="32x32">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #ffffff;
      text-align: center;
      color: #333;
    }

    .site-header {
      background: #fff;
      padding: 15px 0;
      border-bottom: 2px solid #eee;
    }

    .brand-logo {
      width: 160px;
    }

    .mensaje-container {
      max-width: 800px;
      margin: 70px auto 40px;
      padding: 20px;
    }

    .mensaje-container h1 {
      font-size: 36px;
      color: #ff4fa0;
      margin-bottom: 10px;
    }

    .mensaje-container p {
      font-size: 20px;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .btn-volver {
      background: #ff4fa0;
      color: white;
      padding: 12px 25px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 18px;
      font-weight: 600;
      display: inline-block;
    }

    .btn-volver:hover {
      opacity: 0.9;
    }

    /* Footer */
    .mini-footer {
      margin-top: 60px;
      padding: 20px 0;
      background: #f2f2f2;
    }

    .enlaces-footer {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .btn-footer {
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 10px;
      color: #fff;
      font-weight: bold;
      font-size: 16px;
    }

    .naranja { background: #ff6f3c; }
    .azul { background: #007bff; }
    .verde { background: #28a745; }
    .amarillo { background: #f3c623; color: #333; }
    .morado { background: #a259ff; }
    .rosa {background: #ff4fa3}
  </style>
</head>

<body>

  <!-- HEADER -->
  <header class="site-header">
    <a href="index.html">
      <img src="img/inicio_1.png" alt="Catalejo" class="brand-logo">
    </a>
  </header>

  <!-- MENSAJE -->
  <div class="mensaje-container">
    <h1>¡Gracias!</h1>
    <p>Tu mensaje fue enviado correctamente.<br>  
    Nuestro equipo lo revisará y te responderá pronto.</p>

    <a href="index.html" class="btn-volver">Volver al inicio</a>
  </div>

  <footer class="mini-footer">
    <div class="enlaces-footer">
      <a href="index.html" class="btn-footer naranja" >Inicio</a>
      <a href="quienes.html" class="btn-footer azul">Quiénes somos</a>
      <a href="blog.html" class="btn-footer verde">Blog</a>
      <a href="podcast.html" class="btn-footer amarillo">Podcast</a>
      <a href="adaptaciones.html" class="btn-footer morado">Adaptaciones</a>
      <a href="contacto.html" class="btn-footer rosa">Contactanos</a>
    </div>
  </footer>

</body>
</html>
